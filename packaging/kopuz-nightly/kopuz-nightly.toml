# cargo-packager config for Kopuz Nightly; CI fills @VERSION@ and copies the binaries to their -nightly names first.
name = "kopuz"
product-name = "Kopuz Nightly"
version = "@VERSION@"
identifier = "moe.kopuz.kopuz.nightly"
publisher = "temidaradev"
authors = ["temidaradev"]
category = "Music"
description = "A modern, lightweight music player built with Rust and GPUI, from the latest development code."
license-file = "../../LICENSE"
icons = ["logo.png", "app.ico"]
deep-link-protocols = [{ schemes = ["kopuz"] }]
file-associations = [
  { ext = ["flac"], name = "FLAC Audio", description = "FLAC Audio File", mime-type = "audio/flac", role = "Viewer" },
  { ext = ["mp3", "mp2", "mp1"], name = "MP3 Audio", description = "MPEG Audio File", mime-type = "audio/mpeg", role = "Viewer" },
  { ext = ["wav", "wave"], name = "WAV Audio", description = "WAV Audio File", mime-type = "audio/wav", role = "Viewer" },
  { ext = ["ogg", "oga"], name = "Ogg Audio", description = "Ogg Audio File", mime-type = "audio/ogg", role = "Viewer" },
  { ext = ["opus"], name = "Opus Audio", description = "Opus Audio File", mime-type = "audio/opus", role = "Viewer" },
  { ext = ["m4a", "m4b"], name = "M4A Audio", description = "MPEG-4 Audio File", mime-type = "audio/mp4", role = "Viewer" },
  { ext = ["aac"], name = "AAC Audio", description = "AAC Audio File", mime-type = "audio/aac", role = "Viewer" },
  { ext = ["aiff", "aif", "aifc"], name = "AIFF Audio", description = "AIFF Audio File", mime-type = "audio/aiff", role = "Viewer" },
  { ext = ["mka"], name = "Matroska Audio", description = "Matroska Audio File", mime-type = "audio/x-matroska", role = "Viewer" },
  { ext = ["weba"], name = "WebM Audio", description = "WebM Audio File", mime-type = "audio/webm", role = "Viewer" },
  { ext = ["caf"], name = "Core Audio", description = "Core Audio File", mime-type = "audio/x-caf", role = "Viewer" },
]
binaries-dir = "../../target/release"
binaries = [
  { path = "kopuz-nightly", main = true },
  { path = "kopuzd-nightly" },
  { path = "kopuzctl-nightly" },
]

[macos]
minimum-system-version = "11.0"
info-plist-path = "../kopuz/Info.plist"

[nsis]
installer-icon = "app.ico"
template = "../kopuz/installer.nsi"
